openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://localhost:8085
    description: Generated server url
paths:
  /finance/invoice/{invoiceId}:
    put:
      tags:
        - invoice-api
      operationId: updateInvoice
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
  /finance/invoice/{invoiceId}/payment:
    get:
      tags:
        - invoice-api
      operationId: getPaymentByInvoiceId
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
    put:
      tags:
        - invoice-api
      operationId: updatePayment
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
    delete:
      tags:
        - invoice-api
      operationId: deletePaymentByInvoiceId
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PaymentResponse'
  /finance/contract/{contractId}:
    get:
      tags:
        - contract-api
      operationId: findContractById
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ContractResponse'
    put:
      tags:
        - contract-api
      operationId: updateContract
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ContractResponse'
    delete:
      tags:
        - contract-api
      operationId: deleteContractById
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /finance/invoice:
    post:
      tags:
        - invoice-api
      operationId: createInvoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
  /finance/contract:
    get:
      tags:
        - contract-api
      operationId: findAllContracts
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractResponse'
    post:
      tags:
        - contract-api
      operationId: createContract
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ContractResponse'
  /finance/contract/{contractId}/status:
    post:
      tags:
        - contract-api
      operationId: updateContractStatus
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractStatusUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ContractResponse'
  /finance/currency:
    get:
      tags:
        - currency-api
      operationId: findCurrencies
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CurrencyResponse'
  /finance/currency/{currencyId}:
    get:
      tags:
        - currency-api
      operationId: findCurrencyById
      parameters:
        - name: currencyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CurrencyResponse'
  /finance/contract/{contractId}/invoice:
    get:
      tags:
        - contract-api
      operationId: findInvoicesByContractId
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
  /finance/contract/status/transition:
    get:
      tags:
        - contract-api
      operationId: findAllContractStatusTransitions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractStatusTransitionResponse'
components:
  schemas:
    UpdateInvoiceRequest:
      type: object
      properties:
        amount:
          type: number
          description: The amount of the invoice
        dueDate:
          type: string
          format: date
          description: 'The last day for payment '
        description:
          type: string
          description: The user account ID
          minLength: 1
      required:
        - amount
        - dueDate
    InvoiceResponse:
      type: object
      properties:
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: integer
          format: int32
        amount:
          type: number
        dueDate:
          type: string
          format: date
        description:
          type: string
        paid:
          type: boolean
        paymentResponse:
          $ref: '#/components/schemas/PaymentResponse'
    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        amount:
          type: number
        paymentDate:
          type: string
          format: date
        note:
          type: string
    PaymentRequest:
      type: object
      properties:
        amount:
          type: number
          description: The amount paid
          example: 299.9
        paymentDate:
          type: string
          format: date
          description: The date of the payment
          example: '2025-04-10'
        note:
          type: string
          description: The note of the payment
          example: Paid by bank transfer
      required:
        - amount
        - paymentDate
    ContractRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
          description: The ID of the customer
        totalAmount:
          type: number
          description: The total amount of the contract
          example: 299.9
        frequency:
          type: string
          description: The frequency of the payment
          example: MONTHLY
        paymentDay:
          type: integer
          format: int32
          description: The ID of the customer
          example: 10
          maximum: 31
          minimum: 1
        start:
          type: string
          format: date
          description: The ID of the customer
          example: '2025-01-15'
        end:
          type: string
          format: date
          description: The ID of the customer
          example: '2025-07-15'
        terminationClause:
          type: string
          description: The ID of the customer
        penaltyFee:
          type: number
          description: The ID of the customer
        currencyId:
          type: string
          format: uuid
          description: The ID of the customer
      required:
        - customerId
        - totalAmount
    ContractResponse:
      type: object
      properties:
        contractId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        totalAmount:
          type: number
        frequency:
          type: string
        paymentDay:
          type: integer
          format: int32
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        status:
          type: string
          enum:
            - QUOTATION
            - AWAITING_SIGNATURE
            - APPROVED
            - RUNNING
            - TERMINATED
            - CANCELLED
        type:
          type: string
          enum:
            - QUOTE
            - AMENDMENT_QUOTE
            - CANCELLATION_QUOTE
            - CONTRACT
            - AMENDMENT_CONTRACT
            - CANCELLATION_CONTRACT
        terminationClause:
          type: string
        penaltyFee:
          type: number
        currencyId:
          type: string
          format: uuid
    CreateInvoiceRequest:
      type: object
      properties:
        contractId:
          type: string
          format: uuid
          description: The ID of the contract
        amount:
          type: number
          description: The amount of the invoice
        dueDate:
          type: string
          format: date
          description: 'The last day for payment '
        description:
          type: string
          description: The user account ID
          minLength: 1
      required:
        - amount
        - contractId
        - dueDate
    ContractStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
          description: The new status of the contract
          enum:
            - QUOTATION
            - AWAITING_SIGNATURE
            - APPROVED
            - RUNNING
            - TERMINATED
            - CANCELLED
      required:
        - status
    CurrencyResponse:
      type: object
      properties:
        currencyId:
          type: string
          format: uuid
          description: The id of the currency
        name:
          type: string
          description: The description of the currency
        code:
          type: string
          description: The code of the currency
        symbol:
          type: string
          description: The symbol of the currency
    ContractStatusTransitionResponse:
      type: object
      properties:
        fromStatus:
          type: string
          enum:
            - QUOTATION
            - AWAITING_SIGNATURE
            - APPROVED
            - RUNNING
            - TERMINATED
            - CANCELLED
        toStatus:
          type: string
          enum:
            - QUOTATION
            - AWAITING_SIGNATURE
            - APPROVED
            - RUNNING
            - TERMINATED
            - CANCELLED
